[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextgen-test-automation"
version = "0.2.0"
description = "AI-powered no-code self-healing test automation framework — Phase 1"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Automation Team" }]
dependencies = []

[project.optional-dependencies]
# ── individual feature groups ──────────────────────────────────────────────
api     = ["fastapi>=0.112", "uvicorn>=0.30"]
web     = ["playwright>=1.45"]
http    = ["httpx>=0.27"]
ai      = ["langchain>=0.2", "langchain-openai>=0.1", "langchain-core>=0.2"]

# ── full Phase 1 install ───────────────────────────────────────────────────
phase1  = [
    "fastapi>=0.112",
    "uvicorn>=0.30",
    "playwright>=1.45",
    "httpx>=0.27",
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "langchain-core>=0.2",
]

# ── developer tooling ──────────────────────────────────────────────────────
dev     = [
    "pytest>=8",
    "httpx>=0.27",
    "fastapi>=0.112",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
